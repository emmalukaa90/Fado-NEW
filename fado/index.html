<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#2a1b2e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Fado: Tropem do Domu</title>
  </head>
  <body>
    <div id="splash" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#2a1b2e;color:#ffd9a8;font:700 20px sans-serif;z-index:1">Fado: ładowanie…</div>
    <div id="fado-errors" style="display:none;position:fixed;left:0;right:0;bottom:0;max-height:45%;overflow:auto;background:rgba(120,0,0,.92);color:#fff;font:11px/1.35 monospace;padding:8px;z-index:99;white-space:pre-wrap"></div>
    <script>
      (function () {
        var box = document.getElementById('fado-errors');
        function report(msg) {
          box.style.display = 'block';
          box.textContent += msg + '\n\n';
        }
        window.__fadoReportError = report;
        window.addEventListener('error', function (e) {
          report('Błąd: ' + (e.message || e.type) + (e.filename ? ' @ ' + e.filename.split('/').pop() + ':' + e.lineno : ''));
        });
        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason;
          report('Promise: ' + (r && r.message ? r.message : String(r)));
        });
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
